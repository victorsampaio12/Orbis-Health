<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Menu Hospital</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/menuhospital.css') }}">
</head>
<body>
    <div class="modal-topo">
        <div class="left-group">
         <a href="{{ url_for('hospital_bp.selecionar_hospital') }}">
            <button class="btn-voltar">
                <img src="{{ url_for('static', filename='imagens/voltarbranco.png') }}" alt="voltar">
            </button>
        </a>
        <h1>{{ hospital.nome }}</h1>
        </div>
    </div>
    <div class="menu-principal">
        <a href="{{ url_for('hospital_bp.emergencias_a_caminho') }}">
            <button class="botao-menu">
                <span>Emergências a Caminho</span>
                <img src="{{ url_for('static', filename='imagens/cruzvermelha.png') }}" alt="Cadastros" class="icon-botao">
            </button>
        </a>
        <a href="{{ url_for('emergencia_bp.historico_emergencias', hospital_id=hospital.id) }}">
            <button class="botao-menu">
                <span>Histórico de Emergências</span>
                <img src="{{ url_for('static', filename='imagens/listahospital.png') }}" alt="Lista" class="icon-botao">
            </button>
        </a>
    </div>
</body>
</html>
