<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Selecionar Hospital</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/selecionarhospital.css') }}">
</head>
<body>
    <div class="container">
        <h2>Escolha seu hospital</h2>
        <form method="POST">
            {% for hospital in hospitais %}
                <button type="submit" name="hospital_id" value="{{ hospital.id }}" class="btn-hospital">
                    {{ hospital.nome }}
                </button>
            {% endfor %}
            <a href="{{ url_for('telainicial.telainicial') }}" class="btn-voltar">← Voltar</a>
        </form>
    </div>
</body>
</html>
