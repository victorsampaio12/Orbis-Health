<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Socorrista</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/cadastrosocorrista.css') }}">
    <script src="{{ url_for('static', filename='javascript/mascaras.js') }}"></script>
</head>
<body>
    <div class="container">
        <a href="{{ url_for('telainicial.telainicial') }}">
                <button class="btn-voltar">
                    <img src="{{ url_for('static', filename='imagens/voltarvermelho.png') }}" alt="voltar">
                </button>
            </a>
        <h1>Cadastro de Socorrista</h1>
        <form method="POST" action="{{ url_for('socorrista_bp.cadastrar_socorrista') }}">
            {{ form.hidden_tag() }}

            <div class="form-section">
                <label>{{ form.nome.label }}</label>
                {{ form.nome(size=40) }}

                <label>{{ form.cpf.label }}</label>
                {{ form.cpf(size=20) }}

                <label>{{ form.telefone.label }}</label>
                {{ form.telefone(size=20) }}

                <label>{{ form.email.label }}</label>
                {{ form.email(size=40) }}

                <label>{{ form.registro.label }}</label>
                {{ form.registro(size=20) }}

                <label>{{ form.especialidade.label }}</label>
                {{ form.especialidade() }}

                <label>{{ form.turno.label }}</label>
                {{ form.turno() }}
            </div>

            {{ form.submit(class_="btn") }}
        </form>
    </div>
</body>
</html>
