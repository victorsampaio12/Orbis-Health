<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8" />
    <title>Lista de Hospitais</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/lista_hospitais.css') }}" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet/dist/leaflet.css"/>
    <script src="https://cdn.jsdelivr.net/npm/leaflet/dist/leaflet.js"></script>
    <script defer src="{{ url_for('static', filename='javascript/mapa_socorrista.js') }}"></script>
</head>
<body>
    <div id="confirmModal" class="modal-overlay" style="display:none;">
        <div class="modal-content">
            <p>Deseja iniciar o translado agora?</p>
            <div class="modal-buttons">
                <button id="btnConfirm" class="btn btn-confirm">Sim</button>
                <button id="btnCancel" class="btn btn-cancel">Não</button>
            </div>
        </div>
    </div>
    <div id="localizacaoModal" class="modal" style="display:none;">
        <div class="modal-conteudo">
            <h2>Informe sua localização</h2>
            <label for="lat">Latitude:</label>
            <input type="number" id="lat" step="any" placeholder="-23.5" />
            <label for="lng">Longitude:</label>
            <input type="number" id="lng" step="any" placeholder="-46.6" />
            <button onclick="confirmarLocalizacao()">Confirmar</button>
        </div>
    </div>
    <div id="veiculoModal" class="modal" style="display:none;">
        <div class="modal-content">
            <h3>Escolha o veículo</h3>
            <label><input type="radio" name="veiculo" value="H" /> Helicóptero</label><br />
            <label><input type="radio" name="veiculo" value="A" /> Ambulância</label><br /><br />
            <button onclick="confirmarVeiculo()">Confirmar</button>
            <button onclick="fecharModal()">Cancelar</button>
        </div>
    </div>
    <div class="container">
        <header class="top-bar">
            <a href="{{ url_for('menu_bp.menu_socorrista') }}">
                <button class="btn-voltar" aria-label="Voltar">
                    <img
                        src="{{ url_for('static', filename='imagens/voltarvermelho.png') }}"
                        alt="Voltar"
                    />
                </button>
            </a>
            <h1 class="titulo">Lista de Hospitais com leitos livres</h1>
        </header>

        <main class="main-content">
            <section id="mapa" aria-label="Mapa dos hospitais"></section>

            <aside class="lista-hospitais" aria-label="Lista de hospitais próximos">
                <h2>Hospitais Próximos</h2>
                <ul id="lista">
                    {% for h in hospitais %}
                    <li
                        data-hospital-id="{{ h.id }}"
                        data-nome="{{ h.nome }}"
                        data-lat="{{ h.latitude }}"
                        data-lng="{{ h.longitude }}"
                        tabindex="0"
                    >
                        <strong>{{ h.nome }}</strong> - <span class="distancia">?</span> km
                        <button class="ver-rota" aria-label="Ver rota para {{ h.nome }}">
                            Ver rota
                        </button>
                    </li>
                    {% endfor %}
                </ul>
            </aside>
        </main>
    </div>

    <script>
        const hospitais = {{ hospitais|tojson }};
    </script>
</body>
</html>
