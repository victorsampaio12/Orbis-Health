<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Hospital</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/cadastrohospital.css') }}">
</head>
<body class="cadastro-body">
    <form method="POST" action="{{ url_for('hospital_bp.cadastrar_hospital') }}" class="form-container-agente">
        {{ form.hidden_tag() }}
        <div class="container">
             <div class="top-bar">
                <a href="{{ url_for('telainicial.telainicial') }}">
                    <button type="button" class="btn-voltar">
                        <img src="{{ url_for('static', filename='imagens/voltarvermelho.png') }}" alt="voltar">
                    </button>
                </a>
                <h1 class="titulo-agente">Cadastro de Hospital</h1>
            </div>
            <div class="form-section">
                    <label>{{ form.nome.label }}</label>
                    {{ form.nome(class_='form-control-linha') }}

                    <label>{{ form.latitude.label }}</label>
                    {{ form.latitude(class_='form-control-linha') }}

                    <label>{{ form.longitude.label }}</label>
                    {{ form.longitude(class_='form-control-linha') }}
            </div>
            {{ form.submit(class_='btn') }}
        </div>
    </form>
</body>
</html>
