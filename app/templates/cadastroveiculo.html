<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Veículo</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/cadastroveiculo.css') }}">
</head>
<body>
    <div class="container">
        <a href="{{ url_for('telainicial.telainicial') }}">
            <button class="btn-voltar">
                <img src="{{ url_for('static', filename='imagens/voltarvermelho.png') }}" alt="voltar">
            </button>
        </a>
        <h1>Cadastro de Veículo</h1>

        <form method="POST" action="{{ url_for('veiculo_bp.cadastrar_veiculo') }}">
            {{ form.hidden_tag() }}

            <div class="form-section">
                <div class="form-group">
                    <label>{{ form.modelo.label }}</label>
                    {{ form.modelo() }}
                </div>

                <div class="form-group">
                    <label>{{ form.tipo.label }}</label>
                    {{ form.tipo() }}
                </div>

                <div class="form-group">
                    <label>{{ form.identificacao.label }}</label>
                    {{ form.identificacao() }}
                </div>
            </div>

            {{ form.submit(class_="btn") }}
        </form>
    </div>
</body>
</html>
