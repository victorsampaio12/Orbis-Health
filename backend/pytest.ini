[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    regra(*codigos): regras de negócio (RN-xxx / HU-xxx) verificadas pelo teste
    eventos_ws(*nomes): eventos Socket.IO exercitados pelo teste
filterwarnings =
    ignore:datetime.datetime.utcnow:DeprecationWarning
